name: Venture Desk verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: venture-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Backend tests
        run: npm run test:server
      - name: Production build
        run: npm run build
