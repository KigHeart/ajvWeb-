services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_INQUIRY_TRANSPORT: self-hosted
    environment:
      NODE_ENV: production
      PORT: "3000"
      AJENTIR_DB_PATH: /app/data/ajentir.sqlite
      AJENTIR_TRUSTED_PROXY: 172.30.42.2
    expose:
      - "3000"
    volumes:
      - ajentir-data:/app/data
    networks:
      - ajentir-private
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    environment:
      AJENTIR_DOMAIN: ${AJENTIR_DOMAIN:?Set AJENTIR_DOMAIN in the host .env file}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the host .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ajentir-private:
        ipv4_address: 172.30.42.2
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  ajentir-data:
  caddy-data:
  caddy-config:

networks:
  ajentir-private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24
